name: iOS
on:
  push:
    branches: [main, ios-voice-notes]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain and create test device
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          device=$(xcrun simctl create 'Sotto CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "SOTTO_TEST_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Core tests
        run: swift test
      - name: Voice note UI checks
        env:
          SOTTO_IOS_RESULT_PATH: work/ios-tests.xcresult
        run: scripts/test-ios.sh "$SOTTO_TEST_DEVICE"
      - name: Collect app diagnostics
        if: always()
        run: |
          mkdir -p work
          xcrun simctl spawn "$SOTTO_TEST_DEVICE" log show --last 10m --style compact \
            --predicate 'subsystem == "dev.sotto.notes"' > work/ios-session.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-results
          path: |
            work/ios-tests.xcresult
            work/ios-session.log
          if-no-files-found: error
