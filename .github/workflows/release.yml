name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
  ios:
    uses: ./.github/workflows/ios.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
  publish:
    needs: [test, ios]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      NOTARIZE: ${{ vars.SOTTO_NOTARIZE || 'false' }}
      SOTTO_SIGNING_IDENTITY: ${{ secrets.SOTTO_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - name: Validate release mode and version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$RELEASE_TAG" = "v$(cat VERSION)" || { echo 'Release tag must match VERSION' >&2; exit 1; }
          test "$NOTARIZE" = true || test "$NOTARIZE" = false || { echo 'SOTTO_NOTARIZE must be true or false' >&2; exit 1; }
      - name: Validate prerequisites and import signing certificate
        if: env.NOTARIZE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in SOTTO_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD; do
            test -n "${!name}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          test "$RELEASE_TAG" = "v$(cat VERSION)" || { echo 'Tag must match VERSION' >&2; exit 1; }
          keychain="$RUNNER_TEMP/sotto-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Build ad-hoc-signed personal-use release
        if: env.NOTARIZE == 'false'
        run: scripts/release.sh --adhoc
      - name: Sign, notarize, staple, and verify
        if: env.NOTARIZE == 'true'
        run: scripts/release.sh --notarized
      - name: Download verified iOS package
        uses: actions/download-artifact@v8
        with:
          name: Sotto-unsigned-ipa
          path: work/ipa
      - name: Verify iOS package checksum
        run: |
          set -euo pipefail
          cd work/ipa
          shasum -a 256 -c Sotto-unsigned.ipa.sha256
      - name: Attach verified files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ".build/distribution/Sotto-$(cat VERSION)-macOS-universal.zip" .build/distribution/SHA256SUMS \
            work/ipa/Sotto-unsigned.ipa work/ipa/Sotto-unsigned.ipa.sha256
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/sotto-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/sotto-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
