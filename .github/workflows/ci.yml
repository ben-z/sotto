name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test -d "$DEVELOPER_DIR" && xcodebuild -version
      - name: Core tests
        run: swift test
      - name: Benchmark accounting and prerequisite tests
        run: python3 scripts/test-benchmark.py
      - name: Diagnostic log tests
        run: |
          swiftc -swift-version 6 -parse-as-library Sources/sotto/AppLog.swift scripts/test-logs.swift -o .build/test-logs
          .build/test-logs
      - name: Update checker tests
        run: |
          swiftc -swift-version 6 -parse-as-library -I .build/debug/Modules Sources/sotto/UpdateChecker.swift Sources/sotto/AppLog.swift scripts/test-updates.swift .build/debug/SottoCore.build/*.o -o .build/test-updates
          .build/test-updates
      - name: Release preflight tests
        run: python3 scripts/test-release.py
      - name: Package and validate
        env:
          SOTTO_APP_PATH: ${{ github.workspace }}/.build/ci/Sotto.app
        run: |
          scripts/build.sh
          python3 scripts/check-bundle.py "$SOTTO_APP_PATH"
      - name: Measure deterministic resource usage
        run: python3 scripts/benchmark-ci.py
      - name: Upload resource report and samples
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resource-usage-${{ matrix.runner }}
          path: |
            work/ci-performance/report.md
            work/ci-performance/report.json
            work/ci-performance/samples.json
          if-no-files-found: error
      - name: Verify artwork
        run: python3 design/icon/source/rebuild.py --check
      - name: Package personal-use app download
        run: scripts/package-ci.sh
      - name: Upload personal-use app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sotto-app-${{ runner.arch }}
          path: .build/ci-download/*
          if-no-files-found: error
          compression-level: 0
